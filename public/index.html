<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVI - Platform Streaming Video Modern</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background-color: #0b0c10; 
      color: #c5c6c7; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1f2833;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #28313b;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #66fcf1;
      letter-spacing: 1px;
    }

    .nav-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      background: #45a29e;
      color: #0b0c10;
      border: none;
      padding: 8px 16px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.85rem;
    }

    .btn:hover { background: #66fcf1; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-danger:hover { background: #c0392b; }

    .main-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
    }

    /* Player Section */
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Rasio 16:9 */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .video-container {
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #66fcf1;
      font-size: 1rem;
    }

    /* Grid Konten & Channel */
    .section-title {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 15px;
      border-left: 4px solid #66fcf1;
      padding-left: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1f2833;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #28313b;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 15px rgba(102, 252, 241, 0.15);
      border-color: #66fcf1;
    }

    .card-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      background: #0b0c10;
    }

    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-category {
      font-size: 0.7rem;
      color: #45a29e;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background: #1f2833;
      padding: 25px;
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      border: 1px solid #45a29e;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 5px;
      color: #c5c6c7;
    }

    .form-control {
      width: 100%;
      padding: 8px 12px;
      background: #0b0c10;
      border: 1px solid #28313b;
      color: #fff;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .form-control:focus {
      outline: none;
      border-color: #66fcf1;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo"><i class="fa-solid fa-play-circle"></i> NOVI STREAM</div>
    <div class="nav-controls">
      <button class="btn" id="openModalBtn" style="display:none;"><i class="fa-solid fa-plus"></i> Tambah</button>
      <button class="btn" id="loginBtn">Login Admin</button>
    </div>
  </header>

  <div class="main-container">
    <div class="player-wrapper">
      <div class="video-container" id="videoContainer">
        <p>Pilih salah satu siaran di bawah untuk mulai menonton</p>
      </div>
    </div>

    <div class="section-title">Daftar Siaran & Video</div>
    <div class="grid" id="contentGrid">
      </div>
  </div>

  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3 style="color:#fff; margin-bottom:15px; font-size:1.1rem;">Tambah Konten / Siaran Baru</h3>
      <form id="addForm">
        <div class="form-group">
          <label>Judul Siaran / Film</label>
          <input type="text" id="itemTitle" class="form-control" required placeholder="Contoh: RCTI Live / Film A">
        </div>
        <div class="form-group">
          <label>Kategori / Grup</label>
          <input type="text" id="itemCategory" class="form-control" required placeholder="Contoh: NASIONAL / SPORT">
        </div>
        <div class="form-group">
          <label>Link Streaming (.mpd, .m3u8, dll)</label>
          <input type="text" id="itemSrc" class="form-control" required placeholder="Tempel URL link streaming di sini">
        </div>
        <div class="form-group">
          <label>Link Logo / Poster (Opsional)</label>
          <input type="text" id="itemLogo" class="form-control" placeholder="URL gambar poster">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="closeModalBtn" style="background:#555; color:#fff;">Batal</button>
          <button type="submit" class="btn" id="submitBtn">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <footer style="text-align: center; padding: 24px; border-top: 1px solid #28313b; margin-top: 48px; color: #8c95a5; font-size: 0.82rem;">
    <p>Platform Streaming <span style="color: #66fcf1; font-weight: 700;">NOVI</span> &copy; 2026. Dibuat dan dikembangkan oleh <strong style="color: #fff;">Fikri Al</strong>.</p>
  </footer>

  <script>
    let isAdmin = false;
    let allContent = [];

    const videoContainer = document.getElementById('videoContainer');
    const contentGrid = document.getElementById('contentGrid');
    const loginBtn = document.getElementById('loginBtn');
    const openModalBtn = document.getElementById('openModalBtn');
    const addModal = document.getElementById('addModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const addForm = document.getElementById('addForm');

    // Ambil data dari backend / database
    async function fetchContent() {
      try {
        const res = await fetch('/api/content');
        allContent = await res.json();
        renderGrid();
      } catch (err) {
        console.error('Gagal memuat data konten:', err);
      }
    }

    function renderGrid() {
      contentGrid.innerHTML = '';
      if (allContent.length === 0) {
        contentGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#8c95a5;">Belum ada konten tersedia.</p>`;
        return;
      }

      allContent.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.logo || 'https://via.placeholder.com/200x120?text=NOVI+STREAM'}" class="card-img" alt="Poster">
          <div class="card-body">
            <div>
              <div class="card-category">${item.category || ' UMUM'}</div>
              <div class="card-title">${item.title}</div>
            </div>
            ${isAdmin ? `<button class="btn btn-danger" style="padding:4px 8px; font-size:0.7rem; margin-top:8px;" onclick="deleteItem(${index})">Hapus</button>` : ''}
          </div>
        `;
        card.addEventListener('click', (e) => {
          if (!e.target.classList.contains('btn-danger')) {
            loadEpisodePlayer(item.src);
          }
        });
        contentGrid.appendChild(card);
      });
    }

    // Pemutar video otomatis berbasis format menggunakan Shaka Player & HLS.js
    async function loadEpisodePlayer(src) {
      if (src.includes('.mpd')) {
        videoContainer.innerHTML = `<video id="shakaVideo" controls autoplay style="width:100%; height:100%; position:absolute; inset:0; background:#000;"></video>`;
        const videoElement = document.getElementById('shakaVideo');
        
        if (shaka.Player.isBrowserSupported()) {
          const player = new shaka.Player(videoElement);
          try {
            await player.load(src);
          } catch (error) {
            videoContainer.innerHTML = `
              <div style="text-align:center; padding:20px;">
                <p style="color:#e74c3c; font-weight:bold; margin-bottom:10px;">Format DASH (.mpd) Memerlukan Lisensi Khusus</p>
                <button class="btn" onclick="navigator.clipboard.writeText('${src}'); alert('Link berhasil disalin!');">Salin Link Streaming</button>
              </div>`;
          }
        }
      } else if (src.includes('.m3u8') || src.includes('workers.dev')) {
        videoContainer.innerHTML = `<video id="hlsVideo" controls autoplay style="width:100%; height:100%; position:absolute; inset:0;"></video>`;
        const videoElement = document.getElementById('hlsVideo');
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(src);
          hls.attachMedia(videoElement);
        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
          videoElement.src = src;
        }
      } else if (src.includes('youtube.com') || src.includes('youtu.be') || src.includes('<iframe')) {
        let finalSrc = src;
        if (src.includes('<iframe')) {
          const match = src.match(/src="([^"]+)"/);
          if (match && match[1]) finalSrc = match[1];
        }
        videoContainer.innerHTML = `<iframe src="${finalSrc}" style="width:100%; height:100%; border:none; position:absolute; inset:0;" allowfullscreen="true"></iframe>`;
      } else {
        videoContainer.innerHTML = `<video src="${src}" controls autoplay preload="metadata" style="width:100%; height:100%; position:absolute; inset:0;"></video>`;
      }
    }

    // Toggle Login Admin sederhana
    loginBtn.addEventListener('click', () => {
      if (!isAdmin) {
        const pwd = prompt('Masukkan Password Admin:');
        if (pwd === 'admin123' || pwd === 'novi') {
          isAdmin = true;
          loginBtn.innerText = 'Logout Admin';
          loginBtn.style.background = '#e74c3c';
          loginBtn.style.color = '#fff';
          openModalBtn.style.display = 'inline-block';
          alert('Berhasil Login sebagai Admin!');
          renderGrid();
        } else {
          alert('Password salah!');
        }
      } else {
        isAdmin = false;
        loginBtn.innerText = 'Login Admin';
        loginBtn.style.background = '#45a29e';
        loginBtn.style.color = '#0b0c10';
        openModalBtn.style.display = 'none';
        renderGrid();
      }
    });

    openModalBtn.addEventListener('click', () => { addModal.style.display = 'flex'; });
    closeModalBtn.addEventListener('click', () => { addModal.style.display = 'none'; });

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newItem = {
        title: document.getElementById('itemTitle').value,
        category: document.getElementById('itemCategory').value,
        src: document.getElementById('itemSrc').value,
        logo: document.getElementById('itemLogo').value
      };

      try {
        const res = await fetch('/api/content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newItem)
        });
        if (res.ok) {
          addModal.style.display = 'none';
          addForm.reset();
          fetchContent();
          alert('Konten berhasil ditambahkan!');
        } else {
          alert('Gagal menyimpan konten.');
        }
      } catch (err) {
        alert('Terjadi kesalahan jaringan.');
      }
    });

    async function deleteItem(index) {
      if (confirm('Yakin ingin menghapus konten ini?')) {
        try {
          await fetch(`/api/content/${index}`, { method: 'DELETE' });
          fetchContent();
        } catch (err) {
          alert('Gagal menghapus konten.');
        }
      }
    }

    fetchContent();
  </script>
</body>
</html>
