<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVI - Premium Streaming Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #060709;
      --card-bg: #0f1117;
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.45);
      --text-main: #ffffff;
      --text-sub: #8e9bb0;
      --border: #1c202c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #222736; border-radius: 4px; }

    header {
      background: rgba(6, 7, 9, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 48px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 32px; }
    .logo { font-size: 1.8rem; font-weight: 800; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }

    .nav-menu { display: flex; gap: 24px; list-style: none; }
    .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .nav-menu a:hover, .nav-menu a.active { color: #fff; }

    .search-input-group {
      display: flex; align-items: center; background: #0c0e14; border: 1px solid var(--border);
      border-radius: 30px; padding: 8px 20px; width: 340px;
    }
    .search-input-group input { background: none; border: none; color: #fff; width: 100%; outline: none; margin-left: 10px; font-size: 0.88rem; }

    .btn {
      background: var(--accent); color: white; border: none; padding: 10px 22px;
      border-radius: 30px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: all 0.3s; font-size: 0.88rem; box-shadow: 0 4px 18px var(--accent-glow);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); }
    .btn-glass { background: rgba(255,255,255,0.06); border: 1px solid var(--border); box-shadow: none; }
    .btn-glass:hover { background: rgba(255,255,255,0.15); }

    .content-container { max-width: 1500px; margin: 0 auto; padding: 32px 48px; }

    .hero-featured {
      width: 100%; height: 320px; border-radius: 28px;
      background: linear-gradient(180deg, rgba(6,7,9,0.2) 0%, rgba(6,7,9,0.95) 100%), 
                  url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      border: 1px solid var(--border); margin-bottom: 30px;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 40px;
    }
    .hero-badge { background: var(--accent); color: white; font-size: 0.75rem; font-weight: 800; padding: 4px 12px; border-radius: 20px; width: fit-content; margin-bottom: 12px; }
    .hero-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; }
    .hero-subtitle { color: var(--text-sub); font-size: 0.92rem; max-width: 600px; }

    .filter-chips { display: flex; gap: 12px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 6px; }
    .chip {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub);
      padding: 8px 20px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .chip:hover, .chip.active { background: var(--accent); color: white; border-color: var(--accent); }

    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }

    .poster-card {
      background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border);
      overflow: hidden; cursor: pointer; transition: all 0.3s; position: relative; display: flex; flex-direction: column;
    }
    .poster-card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 12px 30px rgba(0,0,0,0.8); }

    .poster-frame { width: 100%; aspect-ratio: 16/10; background: #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .poster-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .poster-card:hover .poster-img { transform: scale(1.1); }

    .hover-overlay {
      position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
    }
    .poster-card:hover .hover-overlay { opacity: 1; }
    .play-glow-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem; }

    .tag-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 8px; }

    .poster-meta { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .poster-title { font-size: 0.92rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .poster-desc { font-size: 0.78rem; color: var(--text-sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; }

    .card-footer-stats { margin-top: auto; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); }

    .btn-delete-card { position: absolute; top: 10px; right: 10px; z-index: 10; background: rgba(231, 76, 60, 0.9); color: white; border: none; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: none; }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-box-wide { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto; }
    .video-viewport { width: 100%; aspect-ratio: 16/9; background: #000; }
    video { width: 100%; height: 100%; outline: none; }
    .modal-body-padding { padding: 24px; }
    .form-input-dark { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: #090a0f; color: white; margin-bottom: 12px; outline: none; font-size: 0.88rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <a href="#" class="logo">NOV<span>I</span></a>
      <ul class="nav-menu">
        <li><a href="#" class="active">Beranda</a></li>
        <li><a href="#">Trending</a></li>
        <li><a href="#">Kategori</a></li>
      </ul>
    </div>

    <div class="search-input-group">
      <i class="fa-solid fa-magnifying-glass" style="color: var(--text-sub);"></i>
      <input type="text" id="searchInput" placeholder="Cari film atau drama..." oninput="filterVideos()">
    </div>

    <div style="display: flex; gap: 12px;">
      <button class="btn" id="btnUpload" style="display: none;"><i class="fa-solid fa-plus"></i> Tambah Video</button>
      <button class="btn btn-glass" id="btnAdmin"><i class="fa-solid fa-user-lock"></i> Admin Login</button>
    </div>
  </header>

  <div class="content-container">
    <div class="hero-featured">
      <span class="hero-badge">FEATURED</span>
      <h1 class="hero-title">Platform Streaming NOVI</h1>
      <p class="hero-subtitle">Tonton koleksi film dan drama pilihan dengan mudah dan cepat tanpa batas.</p>
    </div>

    <div class="filter-chips">
      <div class="chip active" onclick="filterCategory(event, 'All')">Semua</div>
      <div class="chip" onclick="filterCategory(event, 'Drama')">Drama</div>
      <div class="chip" onclick="filterCategory(event, 'Action')">Action</div>
      <div class="chip" onclick="filterCategory(event, 'Anime')">Anime</div>
      <div class="chip" onclick="filterCategory(event, 'Hiburan')">Hiburan</div>
    </div>

    <div style="font-size: 1.3rem; font-weight: 800; margin-bottom: 20px;">Koleksi Video</div>
    <div class="poster-grid" id="videoGrid"></div>
  </div>

  <div class="modal-backdrop" id="playerModal">
    <div class="modal-box-wide">
      <div style="padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);">
        <h3 id="mTitle" style="font-size: 1rem; font-weight: 700;">NOVI Player</h3>
        <i class="fa-solid fa-xmark" style="cursor: pointer; font-size: 1.2rem;" onclick="closeModal('playerModal')"></i>
      </div>
      <div class="video-viewport">
        <video id="mPlayer" controls preload="metadata"></video>
      </div>
      <div class="modal-body-padding">
        <h2 id="mHeader" style="font-size: 1.3rem; font-weight: 800; margin-bottom: 6px;"></h2>
        <p id="mDesc" style="color: var(--text-sub); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4;"></p>
        
        <button class="btn btn-glass" id="btnLike" style="margin-bottom: 20px;"><i class="fa-solid fa-heart" style="color: var(--accent);"></i> <span id="likeNum">0</span> Suka</button>

        <h4 style="margin-bottom: 10px; font-weight: 700;">Komentar</h4>
        <form id="commentForm" style="display: flex; gap: 10px; margin-bottom: 16px;">
          <input type="text" id="cInput" class="form-input-dark" style="margin: 0;" placeholder="Tulis komentar..." required />
          <button type="submit" class="btn">Kirim</button>
        </form>
        <div id="cList" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="loginModal">
    <div class="modal-box-wide" style="max-width: 400px; padding: 24px;">
      <h3 style="margin-bottom: 16px;">Login Admin</h3>
      <form id="loginForm">
        <input type="text" id="userInput" class="form-input-dark" placeholder="Username (bebas)" required />
        <input type="password" id="passInput" class="form-input-dark" placeholder="Password (bebas)" required />
        <button type="submit" class="btn" style="width: 100%; justify-content: center;">Masuk</button>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="uploadModal">
    <div class="modal-box-wide" style="max-width: 450px; padding: 24px;">
      <h3 style="margin-bottom: 16px;">Tambah Video Baru</h3>
      <form id="uploadForm">
        <input type="text" id="uTitle" class="form-input-dark" placeholder="Judul Video" required />
        <select id="uCat" class="form-input-dark">
          <option value="Drama">Drama</option>
          <option value="Action">Action</option>
          <option value="Anime">Anime</option>
          <option value="Hiburan">Hiburan</option>
        </select>
        <input type="text" id="uBadge" class="form-input-dark" placeholder="Badge (Contoh: HD / EP 01)" value="HD" />
        <textarea id="uDesc" class="form-input-dark" style="height: 70px; resize: none;" placeholder="Deskripsi Singkat"></textarea>
        
        <input type="text" id="uSrc" class="form-input-dark" placeholder="Link URL Video (.mp4 / Direct Link)" required />
        <input type="text" id="uThumb" class="form-input-dark" placeholder="Link URL Gambar Cover/Thumbnail (Opsional)" />

        <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 6px;">Simpan Video</button>
      </form>
    </div>
  </div>

  <script>
    const grid = document.getElementById('videoGrid');
    const playerModal = document.getElementById('playerModal');
    const mPlayer = document.getElementById('mPlayer');
    const mTitle = document.getElementById('mTitle');
    const mHeader = document.getElementById('mHeader');
    const mDesc = document.getElementById('mDesc');
    const likeNum = document.getElementById('likeNum');
    const cList = document.getElementById('cList');

    const btnUpload = document.getElementById('btnUpload');
    const btnAdmin = document.getElementById('btnAdmin');
    const loginModal = document.getElementById('loginModal');
    const uploadModal = document.getElementById('uploadModal');

    let allVideos = [];
    let activeVid = null;
    let selectedCategory = 'All';
    let isAdmin = localStorage.getItem('isAdmin') === 'true';

    function renderUI() {
      if (isAdmin) {
        btnUpload.style.display = 'flex';
        btnAdmin.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i> Logout';
      } else {
        btnUpload.style.display = 'none';
        btnAdmin.innerHTML = '<i class="fa-solid fa-user-lock"></i> Admin Login';
      }
      filterVideos();
    }

    btnAdmin.onclick = () => {
      if (isAdmin) {
        isAdmin = false;
        localStorage.removeItem('isAdmin');
        renderUI();
      } else {
        loginModal.style.display = 'flex';
      }
    };

    btnUpload.onclick = () => { uploadModal.style.display = 'flex'; };

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if (id === 'playerModal') {
        mPlayer.pause();
        mPlayer.src = '';
      }
    }

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        if (res.ok) {
          isAdmin = true;
          localStorage.setItem('isAdmin', 'true');
          closeModal('loginModal');
          renderUI();
        }
      } catch (err) {
        alert('Gagal login.');
      }
    };

    async function fetchVideos() {
      try {
        const res = await fetch('/api/videos');
        allVideos = await res.json();
        filterVideos();
      } catch (err) {
        console.error('Gagal memuat video:', err);
      }
    }

    function filterCategory(e, cat) {
      selectedCategory = cat;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');
      filterVideos();
    }

    function displayGrid(videos) {
      grid.innerHTML = '';
      if (!videos || videos.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-sub); font-size: 0.9rem;">Belum ada video.</p>';
        return;
      }

      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = 'poster-card';
        card.onclick = () => play(v);

        card.innerHTML = `
          ${isAdmin ? `<button class="btn-delete-card" style="display:block;" onclick="delVid(event, ${v.id})"><i class="fa-solid fa-trash"></i></button>` : ''}
          <div class="poster-frame">
            <img src="${v.thumbnail}" class="poster-img" />
            <div class="hover-overlay"><div class="play-glow-btn"><i class="fa-solid fa-play"></i></div></div>
            <span class="tag-badge">${v.badge || 'HD'}</span>
          </div>
          <div class="poster-meta">
            <div class="poster-title">${v.title}</div>
            <div class="poster-desc">${v.description}</div>
            <div class="card-footer-stats">
              <span><i class="fa-solid fa-heart" style="color: var(--accent);"></i> ${v.likes || 0}</span>
              <span><i class="fa-solid fa-comment"></i> ${v.comments ? v.comments.length : 0}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function play(v) {
      activeVid = v;
      mPlayer.src = v.src;
      mTitle.innerText = v.title;
      mHeader.innerText = v.title;
      mDesc.innerText = v.description;
      likeNum.innerText = v.likes || 0;
      renderComments(v.comments || []);
      playerModal.style.display = 'flex';
      mPlayer.play().catch(e => {});
    }

    function renderComments(comments) {
      cList.innerHTML = '';
      if (!comments || !comments.length) {
        cList.innerHTML = '<p style="font-size:0.82rem; color:var(--text-sub);">Belum ada komentar.</p>';
        return;
      }
      comments.forEach(c => {
        const d = document.createElement('div');
        d.style.cssText = 'background:#090a0f; padding:10px 14px; border-radius:10px; border:1px solid var(--border); font-size:0.85rem;';
        d.innerHTML = `<div>${c.text}</div><div style="font-size:0.7rem; color:var(--text-sub); margin-top:2px;">${c.date}</div>`;
        cList.appendChild(d);
      });
    }

    document.getElementById('btnLike').onclick = () => {
      if (!activeVid) return;
      activeVid.likes = (activeVid.likes || 0) + 1;
      likeNum.innerText = activeVid.likes;
      filterVideos();
    };

    document.getElementById('commentForm').onsubmit = (e) => {
      e.preventDefault();
      if (!activeVid) return;
      const input = document.getElementById('cInput');
      if (!activeVid.comments) activeVid.comments = [];
      activeVid.comments.push({ text: input.value, date: new Date().toLocaleDateString('id-ID') });
      renderComments(activeVid.comments);
      input.value = '';
      filterVideos();
    };

    function filterVideos() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allVideos.filter(v => v.title.toLowerCase().includes(q));
      if (selectedCategory !== 'All') {
        filtered = filtered.filter(v => (v.category || 'Drama') === selectedCategory);
      }
      displayGrid(filtered);
    }

    async function delVid(e, id) {
      e.stopPropagation();
      if (!confirm("Hapus video ini?")) return;
      try {
        const res = await fetch(`/api/videos/${id}`, { method: 'DELETE' });
        if (res.ok) fetchVideos();
      } catch (err) {
        alert("Gagal menghapus.");
      }
    }

    document.getElementById('uploadForm').onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('uTitle').value,
        category: document.getElementById('uCat').value,
        badge: document.getElementById('uBadge').value,
        description: document.getElementById('uDesc').value,
        src: document.getElementById('uSrc').value,
        thumbnail: document.getElementById('uThumb').value
      };

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alert('Video Berhasil Ditambahkan!');
          closeModal('uploadModal');
          document.getElementById('uploadForm').reset();
          fetchVideos();
        } else {
          alert('Gagal menambah video.');
        }
      } catch (err) {
        alert('Kesalahan koneksi.');
      }
    };

    renderUI();
    fetchVideos();
  </script>
</body>
</html>
