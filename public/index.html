<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVI - Platform Streaming Video Sederhana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
    
    header {
      background: var(--card-bg);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    .nav-controls { display: flex; gap: 12px; align-items: center; }

    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.85rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    .main-container { max-width: 1200px; margin: 24px auto; padding: 0 20px; flex: 1; width: 100%; }

    /* Layout Utama: Pemutar dan Interaksi */
    .watch-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin-bottom: 40px;
    }

    @media(min-width: 900px) {
      .watch-layout { grid-template-columns: 2fr 1fr; }
    }

    .player-section { display: flex; flex-direction: column; gap: 16px; }

    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .video-container {
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      text-align: center;
      padding: 20px;
    }

    .video-info-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .video-title-main { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; color: #fff; }
    
    .video-actions {
      display: flex;
      gap: 16px;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-color);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .action-btn:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--accent); color: var(--accent); }
    .action-btn.liked { color: var(--danger); border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    /* Kolom Komentar */
    .comments-section {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      max-height: 500px;
    }

    .comments-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; color: #fff; }
    
    .comments-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
      padding-right: 5px;
    }

    .comment-item {
      background: rgba(15, 23, 42, 0.6);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
    }

    .comment-form { display: flex; gap: 8px; }
    .comment-input {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border);
      padding: 8px 12px;
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .comment-input:focus { outline: none; border-color: var(--accent); }

    /* Grid Daftar Channel / Video */
    .section-title { font-size: 1.1rem; color: #fff; margin-bottom: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
    }

    .card-img { width: 100%; height: 120px; object-fit: cover; background: #000; }
    .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
    .card-title { font-size: 0.88rem; font-weight: 600; color: #fff; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-category { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      border: 1px solid var(--border);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: 9px 12px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .form-control:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="logo"><i class="fa-solid fa-tv"></i> NOVI STREAM</div>
    <div class="nav-controls">
      <button class="btn" id="openModalBtn" style="display:none;"><i class="fa-solid fa-plus"></i> Tambah Konten</button>
      <button class="btn" id="loginBtn">Login Admin</button>
    </div>
  </header>

  <div class="main-container">
    <div class="watch-layout">
      <div class="player-section">
        <div class="player-wrapper">
          <div class="video-container" id="videoContainer">
            <p><i class="fa-solid fa-circle-play" style="font-size: 2rem; display: block; margin-bottom: 8px; color: var(--accent);"></i>Pilih salah satu siaran di bawah untuk mulai menonton</p>
          </div>
        </div>
        <div class="video-info-box">
          <div class="video-title-main" id="currentVideoTitle">Belum ada video yang diputar</div>
          <div class="video-actions">
            <button class="action-btn" id="likeBtn" onclick="toggleLike()">
              <i class="fa-solid fa-heart"></i> <span id="likeCount">0</span> Suka
            </button>
          </div>
        </div>
      </div>

      <div class="comments-section">
        <div class="comments-title"><i class="fa-solid fa-comments"></i> Komentar Penonton</div>
        <div class="comments-list" id="commentsList">
          <div style="color: var(--text-muted); font-size: 0.82rem; text-align: center; margin-top: 20px;">Belum ada komentar.</div>
        </div>
        <form class="comment-form" onsubmit="postComment(event)">
          <input type="text" id="commentInput" class="comment-input" placeholder="Tulis komentar..." required>
          <button type="submit" class="btn" style="padding: 8px 12px;"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-list"></i> Daftar Siaran & Video Tersedia</div>
    <div class="grid" id="contentGrid">
      </div>
  </div>

  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3 style="color:#fff; margin-bottom:16px; font-size:1.1rem;">Tambah Siaran / Video Baru</h3>
      <form id="addForm">
        <div class="form-group">
          <label>Judul / Nama Channel</label>
          <input type="text" id="itemTitle" class="form-control" required placeholder="Contoh: RCTI / SCTV">
        </div>
        <div class="form-group">
          <label>Kategori / Grup</label>
          <input type="text" id="itemCategory" class="form-control" required placeholder="Contoh: NASIONAL / SPORT">
        </div>
        <div class="form-group">
          <label>Link Streaming (.mpd, .m3u8, dll)</label>
          <input type="text" id="itemSrc" class="form-control" required placeholder="Tempel URL link streaming">
        </div>
        <div class="form-group">
          <label>Link Logo / Poster (Opsional)</label>
          <input type="text" id="itemLogo" class="form-control" placeholder="URL gambar logo">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="closeModalBtn" style="background:#475569; color:#fff;">Batal</button>
          <button type="submit" class="btn">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <footer style="text-align: center; padding: 24px; border-top: 1px solid var(--border); margin-top: 48px; color: var(--text-muted); font-size: 0.82rem;">
    <p>Platform Streaming <span style="color: var(--accent); font-weight: 600;">NOVI</span> &copy; 2026. Dibuat dan dikembangkan oleh <strong style="color: #fff;">Fikri Al</strong>.</p>
  </footer>

  <script>
    let isAdmin = false;
    let allContent = [];
    let currentVideoId = null;

    const videoContainer = document.getElementById('videoContainer');
    const contentGrid = document.getElementById('contentGrid');
    const loginBtn = document.getElementById('loginBtn');
    const openModalBtn = document.getElementById('openModalBtn');
    const addModal = document.getElementById('addModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const addForm = document.getElementById('addForm');
    const currentVideoTitle = document.getElementById('currentVideoTitle');
    const likeCountSpan = document.getElementById('likeCount');
    const likeBtn = document.getElementById('likeBtn');
    const commentsList = document.getElementById('commentsList');

    async function fetchContent() {
      try {
        const res = await fetch('/api/content');
        allContent = await res.json();
        renderGrid();
      } catch (err) {
        console.error('Gagal memuat konten:', err);
      }
    }

    function renderGrid() {
      contentGrid.innerHTML = '';
      if (allContent.length === 0) {
        contentGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:var(--text-muted);">Belum ada konten tersedia.</p>`;
        return;
      }

      allContent.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.logo || 'https://via.placeholder.com/200x120?text=NOVI'}" class="card-img" alt="Poster">
          <div class="card-body">
            <div>
              <div class="card-category">${item.category || 'UMUM'}</div>
              <div class="card-title">${item.title}</div>
            </div>
            ${isAdmin ? `<button class="btn btn-danger" style="padding:4px 8px; font-size:0.7rem; margin-top:8px;" onclick="deleteItem(event, ${index})">Hapus</button>` : ''}
          </div>
        `;
        card.addEventListener('click', (e) => {
          if (!e.target.classList.contains('btn-danger')) {
            playVideo(index, item);
          }
        });
        contentGrid.appendChild(card);
      });
    }

    function playVideo(index, item) {
      currentVideoId = index;
      currentVideoTitle.innerText = item.title;
      loadEpisodePlayer(item.src);
      fetchEngagementData(index);
    }

    // Pemutar otomatis tanpa memunculkan pesan peringatan VLC/DRM
    function loadEpisodePlayer(src) {
      if (src.includes('.mpd')) {
        videoContainer.innerHTML = `<video src="${src}" controls autoplay style="width:100%; height:100%; position:absolute; inset:0; background:#000;"></video>`;
      } else if (src.includes('.m3u8') || src.includes('workers.dev')) {
        videoContainer.innerHTML = `<video id="hlsVideo" controls autoplay style="width:100%; height:100%; position:absolute; inset:0;"></video>`;
        const videoElement = document.getElementById('hlsVideo');
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(src);
          hls.attachMedia(videoElement);
        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
          videoElement.src = src;
        }
      } else if (src.includes('youtube.com') || src.includes('youtu.be') || src.includes('<iframe')) {
        let finalSrc = src;
        if (src.includes('<iframe')) {
          const match = src.match(/src="([^"]+)"/);
          if (match && match[1]) finalSrc = match[1];
        }
        videoContainer.innerHTML = `<iframe src="${finalSrc}" style="width:100%; height:100%; border:none; position:absolute; inset:0;" allowfullscreen="true"></iframe>`;
      } else {
        videoContainer.innerHTML = `<video src="${src}" controls autoplay preload="metadata" style="width:100%; height:100%; position:absolute; inset:0;"></video>`;
      }
    }

    async function fetchEngagementData(id) {
      try {
        const res = await fetch(`/api/content/${id}/engagement`);
        const data = await res.json();
        likeCountSpan.innerText = data.likes || 0;
        if (data.userLiked) {
          likeBtn.classList.add('liked');
        } else {
          likeBtn.classList.remove('liked');
        }
        renderComments(data.comments || []);
      } catch (err) {
        console.error('Gagal memuat suka/komentar', err);
      }
    }

    async function toggleLike() {
      if (currentVideoId === null) {
        alert('Pilih video terlebih dahulu!');
        return;
      }
      try {
        const res = await fetch(`/api/content/${currentVideoId}/like`, { method: 'POST' });
        const data = await res.json();
        likeCountSpan.innerText = data.likes;
        if (data.liked) {
          likeBtn.classList.add('liked');
        } else {
          likeBtn.classList.remove('liked');
        }
      } catch (err) {
        console.error('Gagal mengirim suka', err);
      }
    }

    async function postComment(e) {
      e.preventDefault();
      if (currentVideoId === null) {
        alert('Pilih video terlebih dahulu!');
        return;
      }
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) return;

      try {
        const res = await fetch(`/api/content/${currentVideoId}/comment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const comments = await res.json();
        renderComments(comments);
        input.value = '';
      } catch (err) {
        console.error('Gagal mengirim komentar', err);
      }
    }

    function renderComments(comments) {
      commentsList.innerHTML = '';
      if (!comments || comments.length === 0) {
        commentsList.innerHTML = `<div style="color: var(--text-muted); font-size: 0.82rem; text-align: center; margin-top: 20px;">Belum ada komentar.</div>`;
        return;
      }
      comments.forEach(c => {
        const div = document.createElement('div');
        div.className = 'comment-item';
        div.innerText = c;
        commentsList.appendChild(div);
      });
    }

    loginBtn.addEventListener('click', () => {
      if (!isAdmin) {
        const pwd = prompt('Masukkan Password Admin:');
        if (pwd === 'admin123' || pwd === 'novi') {
          isAdmin = true;
          loginBtn.innerText = 'Logout Admin';
          loginBtn.style.background = var(--danger);
          loginBtn.style.color = '#fff';
          openModalBtn.style.display = 'inline-block';
          alert('Berhasil Login Admin!');
          renderGrid();
        } else {
          alert('Password salah!');
        }
      } else {
        isAdmin = false;
        loginBtn.innerText = 'Login Admin';
        loginBtn.style.background = 'var(--accent)';
        loginBtn.style.color = '#0f172a';
        openModalBtn.style.display = 'none';
        renderGrid();
      }
    });

    openModalBtn.addEventListener('click', () => { addModal.style.display = 'flex'; });
    closeModalBtn.addEventListener('click', () => { addModal.style.display = 'none'; });

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newItem = {
        title: document.getElementById('itemTitle').value,
        category: document.getElementById('itemCategory').value,
        src: document.getElementById('itemSrc').value,
        logo: document.getElementById('itemLogo').value
      };

      try {
        const res = await fetch('/api/content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newItem)
        });
        if (res.ok) {
          addModal.style.display = 'none';
          addForm.reset();
          fetchContent();
          alert('Konten berhasil ditambahkan!');
        } else {
          alert('Gagal menyimpan.');
        }
      } catch (err) {
        alert('Kesalahan jaringan.');
      }
    });

    async function deleteItem(e, index) {
      e.stopPropagation();
      if (confirm('Yakin ingin menghapus konten ini?')) {
        try {
          await fetch(`/api/content/${index}`, { method: 'DELETE' });
          fetchContent();
        } catch (err) {
          alert('Gagal menghapus.');
        }
      }
    }

    fetchContent();
  </script>
</body>
</html>
